[project]
name = "long-running-agent"
version = "0.6.21"
description = "Persistent VM terminals and browser through private IAP and OS Login access."
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy==2.5.4",
  "pydantic==2.13.5",
  "rich==15.0.0",
  "typer==0.27.3",
]

[project.scripts]
lra = "long_running_agent.cli:main"
vm = "long_running_agent.cli:vm_main"
sarj-vm = "long_running_agent.cli:vm_main"
sarj-connect = "long_running_agent.cli:sarj_connect_main"
sarj-host = "long_running_agent.runtime.host:main"

[project.urls]
Repository = "https://github.com/sarj-ai/long-running-agent"

[build-system]
requires = ["uv_build==0.13.1"]
build-backend = "uv_build"

[tool.deptry.per_rule_ignores]
# The Cloud SDK child imports NumPy when CLOUDSDK_PYTHON_SITEPACKAGES is enabled.
DEP002 = ["numpy"]
