[project]
name = "long-running-agent-workspace"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "long-running-agent",
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "python-hcl2==8.1.4",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/long-running-agent"]

[tool.uv.sources]
long-running-agent = { workspace = true }

[tool.pytest]
minversion = "9.1"
strict = true
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
filterwarnings = ["error"]


[tool.ruff]
extend = ".ruff-strict.toml"

[tool.ruff.per-file-target-version]
"**/admin_worker.py" = "py312"
"**/bootstrap.py" = "py312"
"**/maintenance_worker.py" = "py312"
"**/cleanup_probe.py" = "py312"
