# Managed by `code-standards setup`; commit this file.
bundle = "8.129.11"
rule_profile = "all"
schema = 4

[capabilities]
disable = [
  "swiftformat",
  "swiftlint",
  "ktlint",
  "detekt",
  "mobile-security",
  "jscpd",
  "knip",
]

[artifacts]
durable = [
  "**/README.md",
  "docs/**",
  "**/docs/**",
  "architecture/**",
  "**/adr/**",
  ".github/**",
  "**/AGENTS.md",
  "**/CLAUDE.md",
]

[dest]
kotlin = "."
python = "."
swift = "."
typescript = "apps/docs"

[hooks]
manager = "pre-commit"

[ci]
bootstrap = [
  "mise --no-config --no-env --no-hooks exec aqua:hashicorp/terraform@1.17.0 -- terraform -chdir=terraform init -backend=false -lockfile=readonly -input=false",
  "npm --prefix apps/docs run generate",
]
