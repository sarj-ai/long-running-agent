# Managed by code-standards commit policy; regenerate with `code-standards setup`.
name: Commit policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  # GitHub can select the newest workflow run for a commit after a metadata edit, so every event needs
  # a real verifier result under the stable required name, even when the base and head are unchanged.
  commit-policy-v1:
    concurrency:
      group: commit-policy-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 5
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          ref: ${{ github.event.pull_request.merged && github.event.pull_request.head.sha || '' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: sarj-ai/repo-standards/pull-request-commits@beba1c7fbc7793c5a6d2d0b774b2e0e30eebe69a # v6.22.2
